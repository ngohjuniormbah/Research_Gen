name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src
      - name: Test (pytest)
        run: pytest -q
      - name: Dependency audit (pip-audit)
        run: pip-audit
      - name: Export OpenAPI schema
        run: python scripts/export_openapi.py docs/openapi.json
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image (web/worker share this image)
        run: docker build -t litreview-backend:ci .

  # Deploy scaffold — DISABLED until Railway secrets are set. Enable by creating the
  # repository variable ENABLE_RAILWAY_DEPLOY=true and the secret RAILWAY_TOKEN.
  # See docs/deploy-staging.md.
  deploy-staging:
    runs-on: ubuntu-latest
    needs: docker
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_RAILWAY_DEPLOY == 'true' }}
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy web + worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --service web --detach
          railway up --service worker --detach
      - name: Run migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway run --service web alembic upgrade head
