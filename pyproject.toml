[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litreview-backend"
version = "0.3.0"
description = "AI-powered Literature Review Generator - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "markdown>=3.7",
    "nh3>=0.2.19",
    "pypandoc>=1.14",
    "cryptography>=43.0",
    "sentry-sdk[fastapi]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "pip-audit>=2.7",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
    "types-Markdown",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
