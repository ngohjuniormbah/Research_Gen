# Render Blueprint — FREE single-service staging deploy (one click).
# Docs: https://render.com/docs/blueprint-spec  ·  Walkthrough: docs/deploy-render.md
#
# Provisions: web (API) + Postgres + Key Value (Redis). Generation runs inline in the
# web service (JOBS_EAGER=true), so there is NO separate paid worker — everything fits
# the free tier. Migrations run automatically on container start.
#
# Production (always-on worker, JOBS_EAGER=false) lives on GCP — see docs/deploy-gcp.md.

databases:
  - name: litreview-db
    databaseName: litreview
    user: litreview
    plan: free

services:
  # Key Value (Redis-compatible) for rate limiting + idempotency.
  # If your Render still uses the old keyword, change `keyvalue` to `redis`.
  - type: keyvalue
    name: litreview-redis
    plan: free
    ipAllowList: []

  - type: web
    name: litreview-web
    # Native Python runtime (no Docker build) — light and reliable on the free tier.
    # The Dockerfile (with pandoc + WeasyPrint) is kept for GCP production.
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -e .
    # Migrate, then serve on Render's injected $PORT.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENVIRONMENT
        value: production
      - key: JOBS_EAGER
        value: "true"          # inline generation — no worker needed
      - key: EXPORT_RENDERER
        value: fake            # no pandoc binary in native runtime; real PDF on GCP Docker
      - key: LLM_DEFAULT_PROVIDER
        value: fake            # works with no keys; switch to qwen/openai when set
      - key: DATABASE_URL
        fromDatabase:
          name: litreview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: litreview-redis
          property: connectionString
      - key: FERNET_KEY
        generateValue: true
      - key: EXPORT_URL_SECRET
        generateValue: true
      # Set these in the dashboard when ready (left unset on purpose):
      - key: CORS_ORIGINS
        sync: false            # e.g. ["https://your-frontend"]
      - key: OPENROUTER_API_KEY
        sync: false            # enables real open-source models (qwen, llama, ...)
      - key: OPENAI_API_KEY
        sync: false            # enables paid ChatGPT (provider: openai)
